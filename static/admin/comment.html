<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LincComment 管理后台</title>
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#333;--text2:#999;--border:#e9ecef;--blue:#448aff;--red:#f44336}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--card:#16213e;--text:#ddd;--text2:#888;--border:#2a2a4a}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.login-box{max-width:360px;margin:10vh auto 0;padding:2rem;background:var(--card);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.login-box h1{font-size:1.3rem;margin-bottom:.5rem}
.login-box p{color:var(--text2);font-size:.85rem;margin-bottom:1.5rem}
.login-box input{width:100%;padding:.65rem .9rem;margin-bottom:.75rem;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--bg);color:var(--text)}
.login-box button{width:100%;padding:.65rem;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;font-weight:500}
.login-box button:hover{opacity:.9}
.top{max-width:900px;margin:0 auto;padding:1.5rem 1rem 0}
.top h1{font-size:1.2rem;margin-bottom:.25rem}
.top .sub{color:var(--text2);font-size:.85rem}
.top .btns{margin-top:.75rem;display:flex;gap:.5rem}
.btn{padding:.4rem 1rem;border-radius:6px;border:none;font-size:.85rem;cursor:pointer;font-weight:500}
.btn-out{background:var(--border);color:var(--text)}
.btn-refresh{background:var(--blue);color:#fff}
.stats{display:flex;gap:1rem;margin:1.5rem auto;max-width:900px;padding:0 1rem}
.stat{flex:1;background:var(--card);padding:1rem;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);text-align:center}
.stat-num{font-size:1.6rem;font-weight:700}
.stat-label{font-size:.78rem;color:var(--text2);margin-top:.2rem}
.list{max-width:900px;margin:0 auto;padding:0 1rem 3rem}
.card{background:var(--card);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:1rem;overflow:hidden}
.card-title{padding:.75rem 1rem;font-size:.9rem;font-weight:600;background:var(--bg);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-title span{color:var(--text2);font-weight:400;font-size:.8rem}
.row{display:flex;align-items:flex-start;padding:.75rem 1rem;gap:.75rem;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:#e8e8e8}
.row-body{flex:1;min-width:0}
.row-head{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem .75rem;margin-bottom:.2rem}
.row-head .meta-right{margin-left:auto;display:flex;align-items:center;gap:.75rem;white-space:nowrap}
.row-nick{font-weight:600;font-size:.9rem}
.row-mail{color:var(--text2);font-size:.8rem}
.row-time{color:var(--text2);font-size:.78rem}
.row-text{font-size:.9rem;line-height:1.6;word-break:break-word}
.row-del{background:none;border:1px solid var(--red);color:var(--red);border-radius:5px;padding:.2rem .7rem;font-size:.78rem;cursor:pointer;white-space:nowrap;flex-shrink:0}
.row-del:hover{background:var(--red);color:#fff}
.empty{text-align:center;color:var(--text2);padding:4rem 1rem}
</style>
</head>
<body>
<div id="login" class="login-box">
  <h1>LincComment</h1>
  <p>输入密码登录管理后台</p>
  <input type="password" id="pwd" placeholder="管理员密码" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">登 录</button>
</div>
<div id="app" style="display:none">
  <div class="top">
    <h1>LincComment 管理后台</h1>
    <div class="sub">linchuan-blog.netlify.app</div>
    <div class="btns">
      <button class="btn btn-refresh" onclick="load()">刷新</button>
      <button class="btn btn-out" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>
</div>
<script>
var API='/.netlify/functions/comment',pwd='';

function login(){
  pwd=document.getElementById('pwd').value;if(!pwd)return;
  load().then(function(ok){if(ok){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}else alert('密码错误')});
}
function logout(){pwd='';document.getElementById('login').style.display='block';document.getElementById('app').style.display='none'}

function fmt(t){if(!t)return'';var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

function load(){
  return fetch(API+'?admin=1',{headers:{'x-admin-password':pwd}}).then(function(r){if(!r.ok)return false;return r.json()}).then(function(data){
    if(!data)return false;
    var groups={},total=0;
    data.forEach(function(c){var u=c.url||'/';if(!groups[u])groups[u]=[];groups[u].push(c);total++});
    document.getElementById('stats').innerHTML='<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-label">总评论数</div></div><div class="stat"><div class="stat-num">'+Object.keys(groups).length+'</div><div class="stat-label">涉及文章</div></div>';
    var h='';
    for(var u in groups){
      h+='<div class="card"><div class="card-title">'+u+'<span>'+groups[u].length+' 条</span></div>';
      groups[u].forEach(function(c){
        h+='<div class="row">'
          +'<img class="avatar" src="'+c.avatar+'" alt="" onerror="this.style.background=\'#e8e8e8\'">'
          +'<div class="row-body"><div class="row-head">'
          +'<span class="row-nick">'+(c.nick||'匿名')+'</span>'
          +'<span class="meta-right">'
          +(c.mail?'<span class="row-mail">'+c.mail+'</span>':'')
          +'<span class="row-time">'+fmt(c.createdat)+'</span>'
          +'</span>'
          +'</div><div class="row-text">'+(c.comment||'')+'</div></div>'
          +'<button class="row-del" onclick="del('+c.id+')">删除</button>'
          +'</div>';
      });
      h+='</div>';
    }
    document.getElementById('list').innerHTML=h||'<div class="empty">暂无评论</div>';
    return true;
  }).catch(function(){return false});
}
function del(id){
  if(!confirm('确定删除这条评论？'))return;
  fetch(API+'?id='+id,{method:'DELETE',headers:{'x-admin-password':pwd}}).then(function(r){if(r.ok)load()});
}
</script>
</body>
</html>
